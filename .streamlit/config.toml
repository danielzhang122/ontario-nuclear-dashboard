# Look borrowed from zhangdz.ca (website/css/style.css): near-black, grey ink, one red accent, IBM Plex Mono.
[theme]
base = "dark"
backgroundColor = "#0b0b0b"
secondaryBackgroundColor = "#141414"
textColor = "#d8d8d8"
primaryColor = "#e5484d"
linkColor = "#d8d8d8"
borderColor = "#262626"
showWidgetBorder = true
baseRadius = "none"
font = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap, monospace"
codeFont = "IBM Plex Mono, monospace"
baseFontSize = 14
headingFontWeights = 600
chartCategoricalColors = ["#e5484d", "#6b6b6b"]

[server]
headless = true
